server.port=8081
spring.application.name=LoanApplicationTrackingPortal

spring.datasource.url=jdbc:h2:file:./data/loandb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================================
# SBI Phase 2: KYC Document Upload Storage Path
# Documents stored OUTSIDE public web root (UUID-keyed, secure)
# ============================================================
app.document.upload-dir=./uploads/kyc-documents
