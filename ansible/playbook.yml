---
- name: "Provision Target Node for Loan Application Tracking Portal"
  hosts: loan_servers
  become: yes
  gather_facts: yes

  vars:
    required_packages:
      - curl
      - wget
      - gnupg
      - ca-certificates
      - net-tools
      - ufw
      - default-jre-headless
      - docker.io

    app_directories:
      - { path: "{{ app_root_dir }}", mode: "0755" }
      - { path: "{{ app_root_dir }}/logs", mode: "0755" }
      - { path: "{{ app_root_dir }}/config", mode: "0750" }
      - { path: "{{ app_root_dir }}/data", mode: "0750" }

  tasks:
    # -------------------------------------------------------------
    # 1. Package Installation & OS Prerequisites
    # -------------------------------------------------------------
    - name: "Update APT package cache"
      apt:
        update_cache: yes
      check_mode: no
      when: ansible_os_family == "Debian"

    - name: "Install core system packages and runtimes (Java 17, Docker, UFW)"
      package:
        name: "{{ required_packages }}"
        state: present

    # -------------------------------------------------------------
    # 2. Service Management
    # -------------------------------------------------------------
    - name: "Ensure Docker service is started and enabled on boot"
      service:
        name: docker
        state: started
        enabled: yes
      when: ansible_virtualization_type != "docker" and ansible_virtualization_type != "container"
      ignore_errors: yes

    # -------------------------------------------------------------
    # 3. User & Group Management (Principle of Least Privilege)
    # -------------------------------------------------------------
    - name: "Create dedicated application group: {{ app_group }}"
      group:
        name: "{{ app_group }}"
        gid: "{{ app_gid }}"
        state: present

    - name: "Create unprivileged application user: {{ app_user }}"
      user:
        name: "{{ app_user }}"
        uid: "{{ app_uid }}"
        group: "{{ app_group }}"
        groups: "docker"
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present

    # -------------------------------------------------------------
    # 4. Directory Structure & File Permissions
    # -------------------------------------------------------------
    - name: "Create application directory hierarchy under {{ app_root_dir }}"
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "{{ item.mode }}"
      loop: "{{ app_directories }}"

    - name: "Deploy application environment configuration file"
      copy:
        dest: "{{ app_root_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
        content: |
          # Generated by Ansible Configuration Management
          APP_NAME={{ app_name }}
          ENVIRONMENT={{ target_env }}
          SERVER_PORT={{ app_port }}
          LOG_DIR={{ app_root_dir }}/logs
          DATA_DIR={{ app_root_dir }}/data

    # -------------------------------------------------------------
    # 5. Firewall Configuration (Security Hardening)
    # -------------------------------------------------------------
    - name: "Allow SSH inbound traffic (Port 22)"
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      when: ansible_virtualization_type != "docker" and ansible_virtualization_type != "container"
      ignore_errors: yes

    - name: "Allow Loan Application Tracking Portal inbound traffic (Port {{ app_port }})"
      community.general.ufw:
        rule: allow
        port: "{{ app_port | string }}"
        proto: tcp
      when: ansible_virtualization_type != "docker" and ansible_virtualization_type != "container"
      ignore_errors: yes

    # -------------------------------------------------------------
    # 6. Verification & Health Audit
    # -------------------------------------------------------------
    - name: "Verify Docker engine response"
      command: docker --version
      register: docker_version_output
      changed_when: false

    - name: "Verify Java 17 runtime availability"
      command: java -version
      register: java_version_output
      changed_when: false

    - name: "Display provisioning summary"
      debug:
        msg:
          - "=========================================================="
          - "✅ NODE PROVISIONING COMPLETE & IDEMPOTENT!"
          - "Target Host        : {{ inventory_hostname }}"
          - "Application User   : {{ app_user }} (UID: {{ app_uid }})"
          - "Target Directory   : {{ app_root_dir }}"
          - "Configured Port    : {{ app_port }}"
          - "Docker Runtime     : {{ docker_version_output.stdout }}"
          - "=========================================================="
