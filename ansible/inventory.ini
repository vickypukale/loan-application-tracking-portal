# ==========================================================
# Ansible Inventory for Loan Application Tracking Portal
# ==========================================================

[loan_servers]
# Target host (automatically discovers Python location)
localhost ansible_connection=local ansible_python_interpreter=auto_silent

# Remote Target Server Example (for VM or Cloud node):
# target-node-01 ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[loan_servers:vars]
app_name=loan-portal
app_user=loanapp
app_group=loanapp
app_uid=1001
app_gid=1001
app_port=8081
app_root_dir=/opt/loan-portal
target_env=production
